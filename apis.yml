name: DeepCell
description: 'Deepcell is a Menlo Park, California life-sciences company building an
  AI-powered platform for label-free single-cell morphology analysis, a field it calls
  morpholomics. Its REM-I platform combines label-free imaging, deep learning, and
  gentle cell enrichment to treat single-cell morphology as a high-dimensional, quantitative
  biological readout without destructive sample preparation. Applications span oncology
  and tumor heterogeneity profiling, phenotypic drug discovery, cell and gene therapy
  quality control and manufacturing, regenerative medicine, transplant monitoring,
  neurobiology, and agriculture. Backed by a16z and DCVC, Deepcell was added to the
  API Evangelist network as a portfolio lead; it currently publishes a corporate site,
  blog, and publications but no public developer API, SDK, or documentation surface.'
